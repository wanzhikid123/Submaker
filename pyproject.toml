[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "submaker-studio"
version = "0.6.0.dev4"
description = "Local Windows dual-GPU subtitle and translation workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.8,<7", "httpx>=0.28,<1", "psutil>=6", "keyring>=25", "numpy>=2,<3", "av>=14", "faster-whisper==1.2.1", "ctranslate2==4.8.3", "huggingface-hub>=0.34,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
submaker = "submaker.__main__:main"

[tool.setuptools.packages.find]
include = ["submaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
